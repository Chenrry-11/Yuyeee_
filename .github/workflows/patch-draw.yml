name: Patch draw api

on:
  push:
    paths:
      - patch_draw_api.py
      - patch_photo_flow.py
      - patch_photo_v2.py
      - patch_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        run: |
          python3 patch_draw_api.py
          python3 patch_photo_flow.py
          python3 patch_photo_v2.py

      - name: Commit
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat: photo frame v2"
          git push
