name: sync-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: verify and replace
        env:
          CDN: "https://aka.doubaocdn.com/s/UYY3OcTfxs"
          HASH: "193533d43fb740f5e673527af0833c25d33bc9dd03c9dd088e99737b6e0b06ea"
        run: |
          set -euo pipefail
          curl -sL "$CDN" -o index.html
          echo "$HASH  index.html" | sha256sum -c
      - name: commit push cleanup
        run: |
          set -euo pipefail
          git config user.name "doubao-agent"
          git config user.email "agent@local"
          git add index.html
          git rm -f .github/workflows/sync-index.yml
          git commit -m "style: 颜色变量归并，模糊与圆角三档整理"
          git push origin HEAD:main
