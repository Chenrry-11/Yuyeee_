name: sync-index-once
on:
  workflow_dispatch:
  push:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download snapshot and verify checksum
        run: |
          set -e
          curl -sL --retry 3 "https://aka.doubaocdn.com/s/oxbe49nVHp" -o index.html.new
          echo "927368ccd795648e0f6bc9ae5dd9960533e3ca24d18f3837a00e836ead144eb4  index.html.new" | sha256sum -c -
          mv index.html.new index.html
      - name: Remove this one-off workflow
        run: rm -f .github/workflows/sync-index-once.yml
      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 放大堆叠图片为 3:4 并与头像边线对齐"
          git push origin HEAD:main
