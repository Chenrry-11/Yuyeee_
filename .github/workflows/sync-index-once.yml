name: sync-index-once
on:
  workflow_dispatch:
  push:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download snapshot and verify checksum
        run: |
          set -e
          curl -sL --retry 3 "https://aka.doubaocdn.com/s/q4R8ttWc0W" -o index.html.new
          echo "f7fb22b5b63eb41ee81fb11d4342649ad0642ab4aa184df15edb34605990f681  index.html.new" | sha256sum -c -
          mv index.html.new index.html
      - name: Remove this one-off workflow
        run: rm -f .github/workflows/sync-index-once.yml
      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 展开列表缩略图 cover 填满，修复多图展开裁切错位"
          git push origin HEAD:main
