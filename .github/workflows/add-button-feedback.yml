name: Add gentle button feedback
on:
  push:
    paths:
      - .github/workflows/add-button-feedback.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified button feedback and remove this workflow
        run: |
          echo "61a63fa2fd170b91cf48ce8b84d81510d32b917b8f7ce619c5056af9026378f0  index.html" | sha256sum -c -
          curl -fL "https://aka.doubaocdn.com/s/KS3ol0VJWr" -o /tmp/index.html
          echo "01e914b4d0aa429b5cd5752faacd89fe3d183a4a007e3a8c654e8eb336f665b5  /tmp/index.html" | sha256sum -c -
          mv /tmp/index.html index.html
          rm .github/workflows/add-button-feedback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add gentle press feedback to standard buttons"
          git push origin HEAD:main
