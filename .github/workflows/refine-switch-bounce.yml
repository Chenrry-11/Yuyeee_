name: Refine switch appearance and bounce
on:
  push:
    paths:
      - .github/workflows/refine-switch-bounce.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified switch bounce and remove this workflow
        run: |
          echo "01e914b4d0aa429b5cd5752faacd89fe3d183a4a007e3a8c654e8eb336f665b5  index.html" | sha256sum -c -
          curl -fL "https://aka.doubaocdn.com/s/UFlUfG0wsc" -o /tmp/index.html
          echo "c9598e74cb31e186c8df483b83be9e499f29b91a97ce747557f09ec2f60beb3c  /tmp/index.html" | sha256sum -c -
          mv /tmp/index.html index.html
          rm .github/workflows/refine-switch-bounce.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine switch proportions and add press bounce"
          git push origin HEAD:main
