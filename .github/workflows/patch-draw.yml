name: Patch draw api

on:
  push:
    paths:
      - patch_draw_api.py
      - patch_photo_flow.py
      - patch_photo_v2.py
      - patch_gallery.py
      - patch_const_fix.py
      - patch_nav_fix.py
      - patch_image_quality.py
      - patch_avatar_switch.py
      - patch_avatar_switch2.py
      - patch_avatar_refresh.py
      - patch_richtext.py
      - patch_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches
        run: |
          python3 patch_draw_api.py
          python3 patch_photo_flow.py
          python3 patch_photo_v2.py
          python3 patch_gallery.py
          python3 patch_const_fix.py
          python3 patch_nav_fix.py
          python3 patch_image_quality.py
          python3 patch_avatar_switch.py
          python3 patch_avatar_switch2.py
          python3 patch_avatar_refresh.py
          python3 patch_richtext.py

      - name: Commit
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat: rich text and separators"
          git push
