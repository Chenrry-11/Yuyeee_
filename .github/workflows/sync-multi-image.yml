name: Sync multi-image send
on:
  push:
    paths:
      - .github/workflows/sync-multi-image.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified build
        run: |
          curl -fL "https://aka.doubaocdn.com/s/UGmN7U0Bou" -o /tmp/index.html
          echo "cc69c2dc6a23a94f4569c0a93e68728616d56f4349aa97274d3fcc479897008d  /tmp/index.html" | sha256sum -c -

      - name: Replace index and remove this workflow
        run: |
          mv /tmp/index.html index.html
          rm .github/workflows/sync-multi-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: allow selecting up to 6 photos per message"
          git push origin HEAD:main
