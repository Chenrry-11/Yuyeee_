name: Patch draw api

on:
  push:
    paths:
      - patch_draw_api.py
      - patch_photo_flow.py
      - patch_photo_v2.py
      - patch_gallery.py
      - patch_const_fix.py
      - patch_nav_fix.py
      - patch_image_quality.py
      - patch_avatar_switch.py
      - patch_avatar_switch2.py
      - patch_avatar_refresh.py
      - patch_richtext.py
      - patch_image_text_bind.py
      - patch_avatar_quote_fix.py
      - patch_trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches (fault tolerant)
        run: |
          for p in patch_draw_api.py patch_photo_flow.py patch_photo_v2.py patch_gallery.py patch_const_fix.py patch_nav_fix.py patch_image_quality.py patch_avatar_switch.py patch_avatar_switch2.py patch_avatar_refresh.py patch_richtext.py patch_image_text_bind.py patch_avatar_quote_fix.py; do
            echo "=== $p ==="
            python3 "$p" || echo "warning: $p failed or already superseded, continue"
          done

      - name: Verify latest patch applied
        run: |
          if grep -q 'avatarQuoteFix' index.html; then
            echo "OK: avatarQuoteFix present"
          else
            echo "FAIL: avatarQuoteFix missing"
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "fix: avatar agree words and quote leak"
          git push
