name: Apply first interaction batch
on:
  push:
    paths:
      - .github/workflows/apply-first-batch.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified patch and remove this workflow
        run: |
          echo "7125ad02595bfe1590c030260bd92f112b87468eea3078dbf825ab5e2aebbdfc  index.html" | sha256sum -c -
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          data = ""
          Path('/tmp/first.patch').write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/first.patch
          git apply /tmp/first.patch
          rm .github/workflows/apply-first-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine chat wrapping and unify interface icons"
          git push origin HEAD:main
