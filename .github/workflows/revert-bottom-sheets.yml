name: Revert bottom sheet update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify current deployed file
        run: |
          current="$(sha256sum index.html | awk '{print $1}')"
          echo "current=$current"
          test "$current" = "1a97b3471f6a90522f8515716802e25ec74a98f1217b1611f6590ed9a195c0c4"

      - name: Download and verify previous working baseline
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/4Stjzjm3SO" -o /tmp/index.html
          baseline="$(sha256sum /tmp/index.html | awk '{print $1}')"
          echo "baseline=$baseline"
          test "$baseline" = "b32c672544bdf0dc0a5b884bde1e6d335b111a4ef4f2ec3125c4132e68be8af7"
          cp /tmp/index.html index.html

      - name: Commit restored baseline
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already matches baseline"
            exit 0
          fi
          git commit -m "fix: revert bottom sheet interaction batch"
          git push

      - name: Remove one-time revert workflow
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git rm .github/workflows/revert-bottom-sheets.yml
          git commit -m "chore: remove one-time revert workflow"
          git push
