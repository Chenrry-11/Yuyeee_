name: Fix switch alignment and animate dialogs
on:
  push:
    paths:
      - .github/workflows/fix-switch-dialogs.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified dialog update and remove this workflow
        run: |
          echo "c9598e74cb31e186c8df483b83be9e499f29b91a97ce747557f09ec2f60beb3c  index.html" | sha256sum -c -
          curl -fL "https://aka.doubaocdn.com/s/ULBwzVihdE" -o /tmp/index.html
          echo "b32c672544bdf0dc0a5b884bde1e6d335b111a4ef4f2ec3125c4132e68be8af7  /tmp/index.html" | sha256sum -c -
          mv /tmp/index.html index.html
          rm .github/workflows/fix-switch-dialogs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "center switch thumb and animate responsive dialogs"
          git push origin HEAD:main
